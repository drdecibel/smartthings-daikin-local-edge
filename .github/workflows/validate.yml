name: Validate driver

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua and YAML validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-yaml
          # SmartThings Edge runs Lua 5.3, so prefer it when it is available.
          sudo apt-get install --yes lua5.3 || sudo apt-get install --yes lua5.4
          if command -v lua5.3 > /dev/null; then
            echo "LUA=lua5.3" >> "$GITHUB_ENV"
            echo "LUAC=luac5.3" >> "$GITHUB_ENV"
          else
            echo "LUA=lua5.4" >> "$GITHUB_ENV"
            echo "LUAC=luac5.4" >> "$GITHUB_ENV"
          fi

      - name: Check Lua syntax
        run: |
          find src test -name '*.lua' -print0 | xargs -0 -n1 "$LUAC" -p

      - name: Run core tests
        run: |
          "$LUA" test/test_core.lua

      - name: Run driver tests
        run: |
          "$LUA" test/test_driver.lua

      - name: Check YAML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          paths = [Path("config.yml")]
          paths += sorted(Path("profiles").glob("*.yml"))
          paths += sorted(Path(".github").rglob("*.yml"))
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"{path}: OK")
          PY

      - name: Check driver manifest
        run: python3 tools/check-manifest.py

      - name: Privacy scan
        run: sh tools/privacy-scan.sh
