name: Feature request
description: Suggest a compatible local-control improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: feature
    attributes:
      label: Requested feature
      description: Describe the SmartThings behavior or Daikin function you want.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Relevant local API information
      description: Include only sanitized fields or links to public documentation.
  - type: dropdown
    id: cloud
    attributes:
      label: Requires a cloud service?
      options:
        - "No"
        - "Not sure"
        - "Yes"
    validations:
      required: true
